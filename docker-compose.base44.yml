services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=sistema_supermercado.settings
    # Install deps, apply migrations (no-op when up to date), then serve
    # the live source with Django's auto-reloading dev server.
    command:
      [
        "sh",
        "-ec",
        "pip install --no-cache-dir -r requirements.txt && python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:3000",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: on-failure

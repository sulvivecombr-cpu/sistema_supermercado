<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Sistema Supermercado</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">Supermercado</a>
        <div class="navbar-nav">
          <a class="nav-link" href="{% url 'home' %}">Início</a>
          <a class="nav-link" href="{% url 'caixa' %}">🛒 Caixa</a>
          <a class="nav-link" href="{% url 'registrar_entrega' %}"
            >Receber Entrega</a
          >
          <a class="nav-link" href="{% url 'lista_produtos' %}">Produtos</a>
          <a class="nav-link" href="{% url 'lista_clientes' %}">Clientes</a>
          <a class="nav-link" href="{% url 'lista_funcionarios' %}"
            >Funcionários</a
          >
          <a class="nav-link" href="{% url 'vendas' %}">Vendas</a>
          <a class="nav-link" href="{% url 'relatorios' %}">Relatórios</a>
          {% if user.is_staff %}
          <a class="nav-link" href="{% url 'logout' %}">Sair (admin)</a>
          {% else %}
          <a class="nav-link" href="{% url 'login' %}">Login Admin</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <div class="container">
      {% if messages %} {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %} {% endif %} {% block content %} {% endblock %}
    </div>
  </body>
</html>
